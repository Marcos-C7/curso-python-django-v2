<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería</title>
</head>
<body>

    <!-- 
    Ejercicio: crear una galería simple de tarjetas usando Flexbox.

    NOTAS: 
    - puedes renderizar la solución en el navegador, sin revisar el código, 
        para ver el resultado final e intentar replicarlo.
    - El códgio CSS lo puedes integrar desde un archivo CSS externo o en un 
        bloque <style> en el <head>.
    - No tiene que quedar exactamente igual a la solución y además puedes usar
        los colores que quieras.

    Requisitos HTML:
    - Un título principal en un <h1>.
    - Un contenedor principal para las tarjetas.
    - Dentro del contenedor, agregar al menos 4 tarjetas.
    - Cada tarjeta debe tener:
        - Una imagen.
        - Un título en un <h2>.
        - Un párrafo <p>.
        - Un enlace "Ver más" que no necesita funcionar.

    Requisitos CSS:
    - Cambiar el color de fondo de la página.
    - Usar Flexbox para acomodar las tarjetas horizontalmente.
    - Permitir que las tarjetas bajen de línea cuando no haya espacio.
    - Agregar espacio entre tarjetas.
    - Definir un ancho para cada tarjeta.
    - Agregar fondo blanco a las tarjetas.
    - Agregar padding interno a las tarjetas.
    - Agregar bordes redondeados.
    - Agregar sombra a las tarjetas.
    - Ajustar el tamaño de las imágenes.
    - Centrar el contenido de las tarjetas.
    - Cambiar estilos de enlaces.

    Etiquetas recomendadas:
    div, img, h1, h2, p, a

    Propiedades CSS recomendadas:
    display
    flex-wrap
    gap
    justify-content
    width
    padding
    margin
    background-color
    border-radius
    box-shadow
    text-align
    font-family
    font-size
    text-decoration
    text-decoration-color
    text-decoration-thickness
    text-decoration-style
    text-decoration-skip-ink

    Objetivo:
    Aprender:
    - cómo usar Flexbox para crear galerías,
    - cómo acomodar múltiples elementos,
    - cómo usar flex-wrap,
    - cómo crear tarjetas visuales,
    - y cómo mejorar layouts modernos.

    NOTA: para facilitar el uso de imágenes, podemos usar la URL 
    "https://picsum.photos/<ancho>/<alto>", que genera una imagen aleatoria del
    tamaño especificado en <ancho> y <alto>. Ej. "https://picsum.photos/300/200"
    -->


</body>
</html>
