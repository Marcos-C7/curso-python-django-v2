    - Un subtítulo "Horario" en un <h2>.
    - Una tabla con el horario, las filas deben ser los horarios (ej. 8:00 - 
        10:00) y las columnas los días de la semana. Rellena como gustes.
    - Un subtítulo "Objetivos de la semana" en un <h2>.
    - Una lista de tareas a realizar durante la semana.
    - Un subtítulo "Agregar actividad" en un <h2>.
    - Un formulario para agregar nuevas actividades, con campos para el nombre 
        de la actividad, el día y el horario, y un botón para guardar. No debe
        ser funcional, solo estar presente.
    - NOTA: meter divisores <hr> a consideración de cada quien.

    Etiquetas recomendadas: table, tr, th, td, form, label, input, button

    Restricciones: usar solo HTML, sin CSS ni JavaScript.
    -->
