<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar texto dinámicamente</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- 
    En este ejercicio nos vamos a enfocar en la parte de JavaScript, el código
    HTML y CSS les será dado, así que solo hay que enfocarse en el código 
    JavaScript.

    NOTAS: 
    - Puedes renderizar la solución en el navegador, sin revisar el código, 
        para ver el resultado final e intentar replicarlo.
    - El códgio JavaScript lo puedes integrar desde un archivo JavaScript 
        externo o en un bloque <script> en el <head>.
    - No tiene que quedar exactamente igual a la solución solo que funcione
        similar.
    
    Ejercicio:
    implementar funcionalidad con JavaScript para cambiar el texto
    de un elemento al hacer clic en un botón.

    IMPORTANTE:
    - El HTML y CSS ya están hechos.
    - El ejercicio consiste SOLO en implementar JavaScript.

    Funcionalidad a implementar:
    - Cuando el usuario haga clic en el botón con id:
        "change-text-button"
    - Debe cambiar el texto del párrafo con id:
        "message"

    Texto nuevo:
    "El texto fue cambiado con JavaScript"

    Conceptos JavaScript recomendados:
    document.querySelector
    textContent
    addEventListener

    Objetivo:
    Aprender:
    - selección de elementos,
    - eventos click,
    - modificación de texto,
    - manipulación básica del DOM.
    -->

    <div class="container">
        <h1>Manipulación del DOM</h1>

        <p id="message">Este texto cambiará.</p>

        <button id="change-text-button">Cambiar texto</button>
    </div>

</body>
</html>
