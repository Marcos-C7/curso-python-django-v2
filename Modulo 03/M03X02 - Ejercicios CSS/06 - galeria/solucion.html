<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            width: 250px;
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .card img {
            width: 100%;
            border-radius: 8px;
        }

        .card h2 {
            color: #333;
        }

        .card p {
            line-height: 1.5;
        }

        .card a {
            color: darkblue;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Galería de tarjetas</h1>

    <div class="cards-container">

        <div class="card">
            <img src="https://picsum.photos/300/200" alt="Imagen 1">

            <h2>Montañas</h2>

            <p>Un hermoso paisaje de montañas nevadas.</p>

            <a href="#">Ver más</a>
        </div>

        <div class="card">
            <img src="https://picsum.photos/301/200" alt="Imagen 2">

            <h2>Playa</h2>

            <p>Una playa tropical con agua cristalina.</p>

            <a href="#">Ver más</a>
        </div>

        <div class="card">
            <img src="https://picsum.photos/302/200" alt="Imagen 3">

            <h2>Bosque</h2>

            <p>Un bosque verde lleno de naturaleza.</p>

            <a href="#">Ver más</a>
        </div>

        <div class="card">
            <img src="https://picsum.photos/303/200" alt="Imagen 4">

            <h2>Ciudad</h2>

            <p>Una vista nocturna de una gran ciudad.</p>

            <a href="#">Ver más</a>
        </div>

    </div>
</body>
</html>
