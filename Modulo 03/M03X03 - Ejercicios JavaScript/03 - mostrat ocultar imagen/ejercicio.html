<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mostrar/ocultar imagen</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- 
    En este ejercicio nos vamos a enfocar en la parte de JavaScript, el código
    HTML y CSS les será dado, así que solo hay que enfocarse en el código 
    JavaScript.

    NOTAS: 
    - Puedes renderizar la solución en el navegador, sin revisar el código, 
        para ver el resultado final e intentar replicarlo.
    - El códgio JavaScript lo puedes integrar desde un archivo JavaScript 
        externo o en un bloque <script> en el <head>.
    - No tiene que quedar exactamente igual a la solución solo que funcione
        similar.

    Ejercicio:
    implementar funcionalidad con JavaScript para mostrar y ocultar
    una imagen al hacer clic en un botón.

    IMPORTANTE:
    - El HTML y CSS ya están hechos.
    - El ejercicio consiste SOLO en implementar JavaScript.

    Funcionalidad a implementar:
    - Cuando el usuario haga clic en el botón con id:
        "toggle-button"
    - Debe mostrarse la imagen con id:
        "image"
    - Si la imagen ya está visible:
        debe ocultarse.
    - Si la imagen está oculta:
        debe mostrarse nuevamente.

    Pista:
    - Revisa la propiedad:
        element.style.display

    Conceptos JavaScript recomendados:
    document.querySelector
    addEventListener
    style.display

    Objetivo:
    Aprender:
    - manipulación de estilos desde JavaScript,
    - lectura de estado,
    - condicionales,
    - interacción básica con elementos visuales.
    -->
    
    <div class="container">
        <h1>Mostrar y ocultar</h1>

        <button id="toggle-button">Mostrar / Ocultar imagen</button>

        <img id="image" src="https://picsum.photos/300/200" alt="Imagen de ejemplo">
    </div>

</body>
</html>
