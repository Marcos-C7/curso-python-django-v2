    <!-- 
    Ejercicio: Crea una página HTML que muestre información de una película.

    Requisitos:
    - Un título principal "Película" en un <h1>.
    - Un párrafo corto explicando por qué te gusta la película.
    - Nombre de la película en un <h2>.
    - Imagen de la película (puedes usar una imagen de internet con su URL).
    - Descripción corta de la película en un <p>.
    - Subtítulo "Actores principales" en un <h3>.
    - Lista de actores principales en una lista no ordenada <ul>.
    - Enlace para ver más información de la película, no debe ser funcional.
    - NOTA: meter divisores <hr> a consideración de cada quien.

    Etiquetas recomendadas: html, head, body, h1, h2, p, img, a, ul, li

    Restricciones: usar solo HTML, sin CSS ni JavaScript.

    NOTA: para facilitar el uso de imágenes, podemos usar la URL 
    "https://picsum.photos/<ancho>/<alto>", que genera una imagen aleatoria del
    tamaño especificado en <ancho> y <alto>. Ej. "https://picsum.photos/300/200"
    Si vamos a usar más de una imágen, es recomendable cambiar el tamaño para 
    que no se repitan. Ej. "300/200", "301/200", "300/201", etc.
