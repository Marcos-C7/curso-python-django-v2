<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra de navegación</title>
</head>
<body>

    <!-- 
    Ejercicio: crear un menú de navegación horizontal usando Flexbox.

    NOTAS: 
    - puedes renderizar la solución en el navegador, sin revisar el código, 
        para ver el resultado final e intentar replicarlo.
    - El códgio CSS lo puedes integrar desde un archivo CSS externo o en un 
        bloque <style> en el <head>.
    - No tiene que quedar exactamente igual a la solución y además puedes usar
        los colores que quieras.

    Requisitos HTML:
    - Un contenedor principal <nav>.
    - Dentro del <nav>, una lista no ordenada <ul>.
    - La lista debe contener varios enlaces:
        - Inicio
        - Productos
        - Servicios
        - Contacto
    - Los enlaces no necesitan funcionar.

    Requisitos CSS:
    - Quitar los estilos por defecto de la lista.
    - Cambiar el color de fondo del menú.
    - Cambiar el color de texto de los enlaces.
    - Usar Flexbox para acomodar los elementos horizontalmente.
    - Agregar espacio entre los elementos del menú.
    - Agregar padding interno al menú.
    - Quitar el subrayado de los enlaces.
    - Agregar un efecto hover sencillo a los enlaces.

    Etiquetas recomendadas:
    nav, ul, li, a

    Propiedades CSS recomendadas:
    display
    flex
    gap
    list-style
    background-color
    padding
    color
    text-decoration
    font-family
    font-size
    text-decoration
    text-decoration-color
    text-decoration-thickness
    text-decoration-style
    text-decoration-skip-ink

    Objetivo:
    Aprender:
    - cómo activar Flexbox,
    - cómo acomodar elementos horizontalmente,
    - cómo separar elementos con gap,
    - y cómo usar Flexbox para navegación básica.
    -->

</body>
</html>
