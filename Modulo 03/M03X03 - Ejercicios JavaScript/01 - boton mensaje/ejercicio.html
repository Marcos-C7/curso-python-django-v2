<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="estilos.css">
</head>
<body>

   <!-- 
    En este ejercicio nos vamos a enfocar en la parte de JavaScript, el código
    HTML y CSS les será dado, así que solo hay que enfocarse en el código 
    JavaScript.

    NOTAS: 
    - Puedes renderizar la solución en el navegador, sin revisar el código, 
        para ver el resultado final e intentar replicarlo.
    - El códgio JavaScript lo puedes integrar desde un archivo JavaScript 
        externo o en un bloque <script> en el <head>.
    - No tiene que quedar exactamente igual a la solución solo que funcione
        similar.

    Ejercicio: implementar funcionalidad via JavaScript al botón que tiene id
    "btn-msg" para que muestre un mensaje de alerta con el texto "¡Hola, mundo!" 
    cuando se haga click.

    Pista: usar la función alert() para mostrar el mensaje y el método 
    addEventListener().
    -->

    <h1>JavaScript básico</h1>

    <p>Haz clic en el botón para mostrar un mensaje.</p>

    <button id="btn-msg">Mostrar mensaje</button>

</body>
