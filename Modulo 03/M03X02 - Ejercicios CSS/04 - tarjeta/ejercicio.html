<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta personal</title>
</head>
<body>

    <!-- 
    Ejercicio: crear una tarjeta de perfil personal con HTML y CSS.

    NOTAS: 
    - puedes renderizar la solución en el navegador, sin revisar el código, 
        para ver el resultado final e intentar replicarlo.
    - El códgio CSS lo puedes integrar desde un archivo CSS externo o en un 
        bloque <style> en el <head>.
    - No tiene que quedar exactamente igual a la solución y además puedes usar
        los colores que quieras.

    Requisitos HTML:
    - Un contenedor principal para toda la tarjeta.
    - Una imagen de perfil.
    - Un nombre en un <h1>.
    - Una profesión o descripción corta en un <h2>.
    - Un párrafo <p> con información personal.
    - Un subtítulo "Hobbies" en un <h3>.
    - Una lista no ordenada <ul> con hobbies.
    - Una sección con enlaces a redes sociales.
    - Los enlaces no necesitan funcionar.

    Requisitos CSS:
    - Cambiar el color de fondo de la página.
    - Agregar un fondo blanco a la tarjeta.
    - Definir un ancho fijo para la tarjeta.
    - Centrar horizontalmente la tarjeta.
    - Agregar padding interno.
    - Agregar bordes redondeados.
    - Agregar sombra a la tarjeta.
    - Centrar el texto.
    - Hacer la imagen circular.
    - Cambiar colores de títulos y enlaces.
    - Agregar espacio entre elementos.

    Etiquetas recomendadas:
    div, img, h1, h2, h3, p, ul, li, a

    Propiedades CSS recomendadas:
    background-color
    color
    width
    margin
    padding
    border-radius
    box-shadow
    text-align
    font-family
    font-size
    text-decoration

    Objetivo:
    Aprender:
    - a usar clases CSS,
    - crear contenedores visuales,
    - centrar elementos,
    - usar bordes redondeados,
    - usar sombras,
    - y mejorar el diseño visual de una página.

    NOTA: para facilitar el uso de imágenes, podemos usar la URL 
    "https://picsum.photos/<ancho>/<alto>", que genera una imagen aleatoria del
    tamaño especificado en <ancho> y <alto>. Ej. "https://picsum.photos/200/200"
    -->

</body>
</html>
