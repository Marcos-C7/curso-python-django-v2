<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receta</title>
</head>
<body>

    <!--
    Ejercicio: crear una página de receta y darle estilos con CSS.

    NOTAS: 
    - puedes renderizar la solución en el navegador, sin revisar el código, 
        para ver el resultado final e intentar replicarlo.
    - El códgio CSS lo puedes integrar desde un archivo CSS externo o en un 
        bloque <style> en el <head>.
    - No tiene que quedar exactamente igual a la solución y además puedes usar
        los colores que quieras.

    Requisitos HTML:
    - Un título principal del nombre de la receta en un <h1>.
    - Una imagen representativa del platillo.
    - Un párrafo <p> corto explicando el platillo.
    - Un subtítulo "Ingredientes" en un <h2>.
    - Una lista de ingredientes <ul>.
    - Un subtítulo "Pasos de preparación" en un <h2>.
    - Una lista ordenada <ol>.
    - Un subtítulo "Información de la receta" en un <h2>.
    - Una tabla con:
        - tiempo de preparación,
        - dificultad,
        - porciones.
    - Un enlace "Ver video" que no necesita funcionar.
    - NOTA: meter divisores <hr> a consideración de cada quien.

    Requisitos CSS:
    - Cambiar el color de fondo de la página.
    - Centrar el contenido principal.
    - Agregar un fondo blanco al contenido.
    - Agregar padding interno al contenido.
    - Agregar bordes a la tabla.
    - Cambiar colores de títulos.
    - Cambiar el color del enlace.
    - Agregar margen entre secciones.
    - Ajustar el tamaño de la imagen.

    Etiquetas recomendadas:
    h1, h2, p, img, ul, ol, li, table, tr, th, td, a

    Propiedades CSS recomendadas:
    background-color
    color
    width
    margin
    padding
    border
    border-collapse
    font-family

    Objetivo:
    Aprender:
    - a estilizar tablas,
    - controlar tamaños de imágenes,
    - usar contenedores,
    - manejar espacios,
    - y mejorar la presentación visual del contenido.

    NOTA: para facilitar el uso de imágenes, podemos usar la URL 
    "https://picsum.photos/<ancho>/<alto>", que genera una imagen aleatoria del
    tamaño especificado en <ancho> y <alto>. Ej. "https://picsum.photos/500/300"
    -->

</body>
</html>
