<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias</title>
</head>
<body>

    <!-- 
    Ejercicio: crear una página de noticia simple y darle estilos con CSS.

    NOTAS: 
    - puedes renderizar la solución en el navegador, sin revisar el código, 
        para ver el resultado final e intentar replicarlo.
    - El códgio CSS lo puedes integrar desde un archivo CSS externo o en un 
        bloque <style> en el <head>.
    - No tiene que quedar exactamente igual a la solución y además puedes usar
        los colores que quieras.

    Requisitos HTML:
    - Un título principal de la noticia en un <h1>.
    - Un subtítulo pequeño con la fecha o autor en un <h3>.
    - Una imagen representativa de la noticia.
    - Al menos 3 párrafos <p> con contenido de la noticia.
    - Un subtítulo "Temas relacionados" en un <h2>.
    - Una lista no ordenada <ul> con temas relacionados.
    - Un enlace "Leer más" que no necesita funcionar.
    - NOTA: meter divisores <hr> a consideración de cada quien.

    Requisitos CSS:
    - Cambiar el color de fondo de la página.
    - Cambiar el tipo de letra.
    - Cambiar el color del título principal.
    - Cambiar el tamaño del texto de los párrafos.
    - Agregar un fondo distinto a la noticia.
    - Agregar padding al contenido principal.
    - Agregar margen externo a la noticia.
    - Agregar borde a la imagen.
    - Cambiar el color de los enlaces.

    Etiquetas recomendadas:
    html, head, body, h1, h2, h3, p, img, ul, li, a

    Propiedades CSS recomendadas:
    background-color
    color
    font-family
    font-size
    border
    padding
    margin
    width
    text-decoration

    Objetivo:
    Aprender:
    - aplicar estilos a múltiples elementos,
    - controlar espacios,
    - estilizar imágenes,
    - cambiar colores y tipografías,
    - y mejorar la organización visual de una página.

    NOTA: para facilitar el uso de imágenes, podemos usar la URL 
    "https://picsum.photos/<ancho>/<alto>", que genera una imagen aleatoria del
    tamaño especificado en <ancho> y <alto>. Ej. "https://picsum.photos/500/300"
    -->
    
</body>
</html>
