<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receta de cocina</title>
</head>
<body>

    <!-- 
    Ejercicio: Crea una página HTML que muestre una receta de cocina.

    Requisitos: 
    - Un título principal del nombre de la receta en un <h1>.
    - Una imagen representativa del platillo (puede ser una imagen genérica).
    - Un párrafo <p> corto explicando el platillo.
    - Un subtítulo "Ingredientes" en un <h2>.
    - Una lista de ingredientes <ul>.
    - Un subtítulo "Pasos de preparación" en un <h2>.
    - Una lista ordenada de los pasos de preparación <ol>.
    - Un subtítulo "Información de la receta" en un <h2>.
    - Una tabla con información adicional (tiempo de preparación, dificultad, 
        porciones).
    - Un subtítulo "Video de referencia" en un <h2>.
    - Un enlace hacia un video de YouTube relacionado con la receta (no tiene 
        que ser funcional).
    - NOTA: meter divisores <hr> a consideración de cada quien.

    Etiquetas recomendadas: h1, h2, p, img, ul, ol, li, a

    Restricciones: usar solo HTML, sin CSS ni JavaScript.

    NOTA: para facilitar el uso de imágenes, podemos usar la URL 
    "https://picsum.photos/<ancho>/<alto>", que genera una imagen aleatoria del
    tamaño especificado en <ancho> y <alto>. Ej. "https://picsum.photos/300/200"
    Si vamos a usar más de una imágen, es recomendable cambiar el tamaño para 
    que no se repitan. Ej. "300/200", "301/200", "300/201", etc.
    -->
    
</body>
</html>
