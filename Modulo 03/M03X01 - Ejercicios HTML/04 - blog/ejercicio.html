<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
</head>
<body>

    <!-- 
    Ejercicio: mostrar la estructura básica de un blog.

    Requisitos: 
    - Un <header> con:
        - Un título principal en un <h1>.
        - Un párrafo de introducción al blog.
    - Una barra de navegación <nav> sencilla con enlaces a secciones del blog 
        (Inicio, Artículos, Acerca de, Contacto).
    - Un <main> con:
        - Un <section id="articulos"> (importante poner el id), con:
            - Un título <h2> de "Artículos recientes".
            - Al menos dos artículos, cada uno en un <article> con:
                - Un título <h3>.
                - Una fecha de publicación.
                - Una imagen representativa del artículo.
                - Un párrafo de resumen del artículo.
                - Un enlace "Leer más" que no necesita funcionar.
        - Un <aside> con:
            - Un título <h2> de "Categorías".
            - Una lista de categorías del blog (HTML, CSS, JavaScript, Frontend)
            - Un título <h2> de "Posts recientes".
            - Una lista de enlaces con los títulos de los últimos posts 
                publicados, los enlaces no deben ser funcionales.
        - Un <section id="acerca-de"> (importante el id) con:
            - Un subtítulo "Acerca de" en un <h2>.
            - Un párrafo con información sobre el objetivo del blog.
    - Un pie de página <footer id="contacto"> (importante el id) con información
        de autor, contacto y derechos de autor.
    - IMPORTANTE: para los enlaces de navegación, hay que poner el atributo href
        con el id del elemento HTML al que se quiere dirigir. 
        Ej. href="#articulos" para dirigir al elemento que tiene id "articulos".
    - NOTA: meter divisores <hr> a consideración de cada quien.

    Etiquetas recomendadas: header, nav, main, section, article, aside, footer, 
        h1-h3, p, img, a, ul, li.

    Restricciones: usar solo HTML, sin CSS ni JavaScript.

    NOTA: para facilitar el uso de imágenes, podemos usar la URL 
    "https://picsum.photos/<ancho>/<alto>", que genera una imagen aleatoria del
    tamaño especificado en <ancho> y <alto>. Ej. "https://picsum.photos/300/200"
    Si vamos a usar más de una imágen, es recomendable cambiar el tamaño para 
    que no se repitan. Ej. "300/200", "301/200", "300/201", etc.
    -->
    
</body>
</html>
