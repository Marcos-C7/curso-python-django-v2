<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información Personal</title>
</head>
<body>

   <!-- 
    Ejercicio: crear una página simple con un poco de información personal y 
    estilos básicos con CSS.

    NOTAS: 
    - puedes renderizar la solución en el navegador, sin revisar el código, 
        para ver el resultado final e intentar replicarlo.
    - El códgio CSS lo puedes integrar desde un archivo CSS externo o en un 
        bloque <style> en el <head>.
    - No tiene que quedar exactamente igual a la solución y además puedes usar
        los colores que quieras.

    Requisitos HTML:
    - Un título principal en un <h1>.
    - Un subtítulo en un <h2>.
    - Un párrafo <p> con una pequeña descripción personal.
    - Un subtítulo "Hobbies" en un <h3>.
    - Una lista no ordenada <ul> con varios hobbies.

    Requisitos CSS:
    - Cambiar el color de fondo de toda la página.
    - Cambiar el tipo de letra.
    - Cambiar el color del título principal.
    - Cambiar el color del subtítulo.
    - Agregar un borde al párrafo.
    - Agregar espacio interno (padding) al párrafo.
    - Agregar margen superior al párrafo.
    - Agregar un color de fondo y borde a la lista.

    Etiquetas recomendadas: html, head, body, h1, h2, h3, p, ul, li

    Propiedades CSS recomendadas:
    background-color
    color
    font-family
    border
    padding
    margin
    font-size

    Objetivo:
    Aprender:
    - cómo conectar HTML y CSS,
    - selectores básicos,
    - colores,
    - bordes,
    - margin,
    - padding,
    - y estilos simples.
    -->
    
</body>
</html>
